[package]
name = "dynibo"
version.workspace = true
edition = "2024"
description = "Tree-structured robot kinematics and dynamics with runtime-size workspace APIs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/xiaojie-xue/dynibo"
homepage = "https://github.com/xiaojie-xue/dynibo"
documentation = "https://docs.rs/dynibo"
keywords = ["robotics", "kinematics", "dynamics", "urdf"]
categories = ["science::robotics", "simulation"]
exclude = [
    ".github/",
    "benches/",
    "bindings/",
    "ci/",
    "crates/",
    "tests/native/",
    "tests/python/",
    "CMakeLists.txt",
    "MANIFEST.in",
    "pyproject.toml",
    "setup.py",
]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/rustdoc/katex-header.html"]

[workspace]
members = [
    "bindings/c",
    "bindings/python",
    "crates/dynibo-binding-support",
    "crates/dynibo-oracle",
    "crates/dynibo-bench",
]
resolver = "3"

[workspace.package]
version = "0.5.4"

[dependencies]
nalgebra = "0.34.1"
urdf-rs = "0.9.0"

[dev-dependencies]
approx = "0.5.1"
getrandom = "0.3.4"

[[example]]
name = "franka"
path = "examples/rust/franka.rs"

[[example]]
name = "g1"
path = "examples/rust/g1.rs"

[profile.release]
codegen-units = 1
lto = "fat"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
