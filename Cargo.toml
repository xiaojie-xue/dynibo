[package]
name = "dyno"
version = "0.1.0"
edition = "2024"
description = "Tree-structured robot kinematics and dynamics with runtime-size workspace APIs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/xiaojie-xue/dyno"
homepage = "https://github.com/xiaojie-xue/dyno"
documentation = "https://docs.rs/dyno"
keywords = ["robotics", "kinematics", "dynamics", "urdf"]
categories = ["science::robotics", "simulation"]
exclude = [
    ".github/",
    "bindings/",
    "ci/",
    "package-tests/",
    "python/",
    "CMakeLists.txt",
    "MANIFEST.in",
    "pyproject.toml",
    "setup.py",
]

[workspace]
members = ["bindings/c"]
resolver = "3"

[features]
default = []
core-bench = ["dep:criterion"]
pinocchio-tests = ["dep:cc", "dep:pkg-config"]
pinocchio-bench = ["pinocchio-tests", "dep:criterion"]

[dependencies]
criterion = { version = "0.7.0", optional = true }
nalgebra = "0.34.1"
urdf-rs = "0.9.0"

[dev-dependencies]
approx = "0.5.1"

[build-dependencies]
cc = { version = "1.2.49", optional = true }
pkg-config = { version = "0.3.32", optional = true }

[[bench]]
name = "pinocchio"
harness = false
required-features = ["pinocchio-bench"]

[[bench]]
name = "core"
harness = false
required-features = ["core-bench"]

[profile.release]
codegen-units = 1
lto = "fat"
