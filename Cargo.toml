[package]
name = "dynibo"
version.workspace = true
edition = "2024"
description = "Tree-structured robot kinematics and dynamics with runtime-size workspace APIs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/xiaojie-xue/dynibo"
homepage = "https://github.com/xiaojie-xue/dynibo"
documentation = "https://docs.rs/dynibo"
keywords = ["robotics", "kinematics", "dynamics", "urdf"]
categories = ["science::robotics", "simulation"]
exclude = [
    ".github/",
    "bindings/",
    "ci/",
    "tests/native/",
    "tests/python/",
    "CMakeLists.txt",
    "MANIFEST.in",
    "pyproject.toml",
    "setup.py",
]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/rustdoc/katex-header.html"]

[workspace]
members = ["bindings/c"]
resolver = "3"

[workspace.package]
version = "0.4.1"

[features]
default = []
core-bench = ["dep:criterion"]
pinocchio-tests = ["dep:cc", "dep:pkg-config"]
pinocchio-bench = ["pinocchio-tests", "dep:criterion"]

[dependencies]
criterion = { version = "0.7.0", optional = true }
nalgebra = "0.34.1"
urdf-rs = "0.9.0"

[dev-dependencies]
approx = "0.5.1"
getrandom = "0.3.4"

[build-dependencies]
cc = { version = "1.2.49", optional = true }
pkg-config = { version = "0.3.32", optional = true }

[[bench]]
name = "pinocchio"
harness = false
required-features = ["pinocchio-bench"]

[[bench]]
name = "core"
harness = false
required-features = ["core-bench"]

[[example]]
name = "franka"
path = "examples/rust/franka.rs"

[profile.release]
codegen-units = 1
lto = "fat"
