[package]
name = "dynibo-python"
version.workspace = true
edition = "2024"
description = "PyO3 bindings for dynibo"
license = "MIT"
repository = "https://github.com/xiaojie-xue/dynibo"
homepage = "https://github.com/xiaojie-xue/dynibo"
publish = false

[lib]
name = "_dynibo"
crate-type = ["cdylib"]

[dependencies]
dynibo = { path = "../.." }
nalgebra = "0.34.1"
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
