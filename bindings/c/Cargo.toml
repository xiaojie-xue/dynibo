[package]
name = "dynibo-c"
version.workspace = true
edition = "2024"
description = "Stable C ABI for the dynibo robot kinematics and dynamics library"
license = "MIT"
repository = "https://github.com/xiaojie-xue/dynibo"
publish = false

[lib]
name = "dynibo_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
dynibo = { path = "../.." }
nalgebra = "0.34.1"
