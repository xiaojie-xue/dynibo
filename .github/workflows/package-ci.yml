name: Package CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  coverage:
    name: Rust line and branch coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.6
      - name: Collect coverage
        run: >-
          cargo +nightly llvm-cov --branch --workspace --all-targets
          --json --summary-only --output-path coverage.json
      - name: Enforce coverage thresholds
        run: >-
          python ci/check-coverage.py coverage.json
          --min-lines 85 --min-branches 75
      - name: Generate Codecov report
        run: >-
          cargo +nightly llvm-cov report --branch
          -p dyno -p dyno-c --codecov --output-path codecov.json
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: codecov.json
          fail_ci_if_error: true
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: |
            coverage.json
            codecov.json
          if-no-files-found: error

  rust-package:
    name: Rust crate package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and test the extracted crate
        run: bash ci/test-rust-package.sh
      - name: Upload crate
        uses: actions/upload-artifact@v7
        with:
          name: rust-crate
          path: target/package/dyno-*.crate
          if-no-files-found: error

  native-package:
    name: C/C++ package tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Configure native package
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native package
        run: cmake --build build/native --config Release --parallel
      - name: Create CPack archive
        run: cmake --build build/native --config Release --target package
      - name: Test installed C and C++ package
        run: python ci/test-native-package.py --package-dir build/native --configuration Release
      - name: Upload C/C++ package
        uses: actions/upload-artifact@v7
        with:
          name: native-package-${{ runner.os }}-${{ runner.arch }}
          path: build/native/dyno-*.tar.gz
          if-no-files-found: error

  python-wheel:
    name: Python wheel tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install wheel builder
        run: python -m pip install cibuildwheel==3.4.1
      - name: Build and test installed wheel
        run: python -m cibuildwheel --output-dir wheelhouse
      - name: Upload Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ runner.os }}-${{ runner.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist
      - name: Build wheel from source distribution
        run: python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir dist/from-sdist
      - name: Test wheel built from source distribution
        shell: bash
        run: |
          python -m venv target/sdist-test
          target/sdist-test/bin/python -m pip install --no-deps dist/from-sdist/*.whl
          target/sdist-test/bin/python package-tests/python/test_package.py tests/data/test_arm.urdf
      - name: Upload Python source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
