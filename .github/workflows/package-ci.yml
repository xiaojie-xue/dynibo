name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Compile core Criterion benchmarks
        run: cargo check --locked --features core-bench --bench core

  coverage:
    name: Rust line and branch coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.6
      - name: Collect coverage
        run: >-
          cargo +nightly llvm-cov --branch --workspace --all-targets
          --json --summary-only --output-path coverage.json
      - name: Enforce coverage thresholds
        run: >-
          python ci/check-coverage.py coverage.json
          --min-lines 85 --min-branches 75
      - name: Generate Codecov report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          cargo +nightly llvm-cov report --branch
          -p dynibo -p dynibo-c --codecov --output-path codecov.json
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
          files: codecov.json
          fail_ci_if_error: true
      - uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage.json
          if-no-files-found: error

  pinocchio-reference:
    name: Pinocchio numerical reference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pinocchio-reference
          create-args: >-
            pinocchio=3.9.0
            pkg-config
          init-shell: bash
      - name: Compare kinematics and dynamics with Pinocchio
        shell: micromamba-shell {0}
        run: |
          export PKG_CONFIG_PATH="${CONDA_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          cargo test -p dynibo --locked --features pinocchio-tests --tests
      - name: Compile Pinocchio Criterion benchmarks
        shell: micromamba-shell {0}
        run: |
          export PKG_CONFIG_PATH="${CONDA_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          cargo check --locked --features pinocchio-bench --bench pinocchio

  rust-package:
    name: Rust crate package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and test the extracted crate
        run: bash ci/test-rust-package.sh target/package
      - name: Upload crate
        uses: actions/upload-artifact@v7
        with:
          name: rust-crate
          path: target/package/dynibo-*.crate
          if-no-files-found: error

  native-package:
    name: C/C++ package tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Configure native package
        run: >-
          cmake -S . -B build/native
          -DCMAKE_BUILD_TYPE=Release
          -DDYNIBO_PACKAGE_PLATFORM=${{ runner.os }}-${{ runner.arch }}
      - name: Build native package
        run: cmake --build build/native --config Release --parallel
      - name: Create CPack archive
        run: cmake --build build/native --config Release --target package
      - name: Test installed C and C++ package
        run: python ci/test-native-package.py --package-dir build/native --configuration Release
      - name: Upload C/C++ package
        uses: actions/upload-artifact@v7
        with:
          name: native-package-${{ runner.os }}-${{ runner.arch }}
          path: build/native/dynibo-*.tar.gz
          if-no-files-found: error

  python-wheel:
    name: Python wheel tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install wheel builder
        run: python -m pip install cibuildwheel==3.4.1
      - name: Build and test installed wheel
        run: python -m cibuildwheel --output-dir wheelhouse
      - name: Upload Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ runner.os }}-${{ runner.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist
      - name: Build wheel from source distribution
        run: python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir dist/from-sdist
      - name: Test wheel built from source distribution
        shell: bash
        run: |
          python -m venv target/sdist-test
          target/sdist-test/bin/python -m pip install dist/from-sdist/*.whl
          target/sdist-test/bin/python tests/python/test_package.py tests/data/test_arm.urdf tests/data/pinocchio_reference_v1.tsv
      - name: Upload Python source distribution
        uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
