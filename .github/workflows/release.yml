# Maintainer release checklist:
# 1. Synchronize all package versions and run ci/check-release-version.py.
# 2. Run ci/test-all.sh, then commit and tag the release as vMAJOR.MINOR.PATCH.
# 3. Publish a non-prerelease GitHub Release for that tag to trigger this workflow.

name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: registry-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check tag and package versions
        run: python ci/check-release-version.py "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  rust-package:
    name: Build and test Rust crate
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: bash ci/test-rust-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-rust-crate
          path: target/package/dynibo-*.crate
          if-no-files-found: error

  native-package:
    name: Build and test C/C++ package (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Configure native package
        run: >-
          cmake -S . -B build/native
          -DCMAKE_BUILD_TYPE=Release
          -DDYNIBO_PACKAGE_PLATFORM=${{ runner.os }}-${{ runner.arch }}
      - name: Build native package
        run: cmake --build build/native --config Release --parallel
      - name: Create CPack archive
        run: cmake --build build/native --config Release --target package
      - name: Test installed C and C++ package
        run: >-
          python ci/test-native-package.py
          --package-dir build/native
          --configuration Release
      - uses: actions/upload-artifact@v7
        with:
          name: release-native-${{ runner.os }}-${{ runner.arch }}
          path: build/native/dynibo-*.tar.gz
          if-no-files-found: error

  python-wheel:
    name: Build and test Python wheel (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install wheel builder
        run: python -m pip install cibuildwheel==3.4.1
      - name: Build and test installed wheel
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: release-python-wheel-${{ runner.os }}-${{ runner.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-sdist:
    name: Build and test Python source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build source distribution
        run: |
          python -m pip install build
          python -m build --sdist
      - name: Build wheel from source distribution
        run: python -m pip wheel dist/*.tar.gz --no-deps --wheel-dir dist/from-sdist
      - name: Test wheel built from source distribution
        run: |
          python -m venv target/sdist-test
          target/sdist-test/bin/python -m pip install --no-deps dist/from-sdist/*.whl
          target/sdist-test/bin/python tests/python/test_package.py tests/data/test_arm.urdf tests/data/pinocchio_reference_v1.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: release-python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish-crate:
    name: Publish Rust crate to crates.io
    needs: [rust-package, native-package, python-wheel, python-sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish dynibo
        run: cargo publish -p dynibo --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  publish-pypi:
    name: Publish Python distributions to PyPI
    needs: [rust-package, native-package, python-wheel, python-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-native-assets:
    name: Attach C/C++ packages to GitHub Release
    needs: [rust-package, native-package, python-wheel, python-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-native-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
