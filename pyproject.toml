[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dyno-robotics"
version = "0.1.0"
description = "Python bindings for tree-structured robot kinematics and dynamics"
readme = "bindings/python/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Xiaojie Xue" }]
keywords = ["robotics", "kinematics", "dynamics", "urdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/xiaojie-xue/dyno"
Repository = "https://github.com/xiaojie-xue/dyno"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["dyno"]
include-package-data = true

[tool.setuptools.package-data]
dyno = ["*.so", "*.dylib", "*.dll"]

[tool.cibuildwheel]
build = "cp39-*"
skip = "*-musllinux*"
archs = ["auto64"]
test-command = "python {project}/package-tests/python/test_package.py {project}/tests/data/test_arm.urdf"

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH="$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.12"
