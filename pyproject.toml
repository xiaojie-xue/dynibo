[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynibo"
version = "0.3.0"
description = "Python bindings for tree-structured robot kinematics and dynamics"
readme = "bindings/python/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Xiaojie Xue" }]
keywords = ["robotics", "kinematics", "dynamics", "urdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/xiaojie-xue/dynibo"
Repository = "https://github.com/xiaojie-xue/dynibo"
Documentation = "https://dynibo.readthedocs.io/"
"Rust API" = "https://docs.rs/dynibo"

[dependency-groups]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocs-static-i18n>=1.3,<2",
    "mkdoxy>=1.2.8,<2",
    "mkdocstrings[python]>=0.30,<1",
    "pymdown-extensions>=10.2,<12",
]

[tool.setuptools]
package-dir = { "" = "bindings/python" }
packages = ["dynibo"]
include-package-data = true

[tool.setuptools.package-data]
dynibo = ["*.so", "*.dylib", "*.dll"]

[tool.cibuildwheel]
build = "cp39-*"
skip = "*-musllinux*"
archs = ["auto64"]
test-command = "python {project}/tests/python/test_package.py {project}/tests/data/test_arm.urdf {project}/tests/data/pinocchio_reference_v1.tsv"

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH="$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.12"
